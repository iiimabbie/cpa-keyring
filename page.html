<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f5" />
    <title>Keyring</title>
    <style>
      :root {
        color-scheme: light;
        --bg-secondary: #faf9f5;
        --bg-primary: #f0eee8;
        --bg-tertiary: #e9e6df;
        --bg-hover: #e9e6df;
        --text-primary: #2d2a26;
        --text-secondary: #6d6760;
        --text-tertiary: #a29c95;
        --border-color: #e3e1db;
        --border-primary: #d5d2cb;
        --border-hover: #cecac4;
        --primary-color: #8b8680;
        --primary-hover: #7f7a74;
        --primary-active: #726d67;
        --primary-contrast: #fff;
        --success-color: #10b981;
        --error-color: #c65746;
        --warning-bg: rgba(198, 87, 70, 0.12);
        --warning-border: rgba(198, 87, 70, 0.35);
        --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.08);
        --count-badge-bg: rgba(139, 134, 128, 0.18);
        --count-badge-text: #726d67;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-parent-theme]) {
          color-scheme: dark;
          --bg-secondary: #151412;
          --bg-primary: #1d1b18;
          --bg-tertiary: #262320;
          --bg-hover: #2e2a26;
          --text-primary: #f6f4f1;
          --text-secondary: #c9c3bb;
          --text-tertiary: #9c958d;
          --border-color: #3a3530;
          --border-primary: #4a453f;
          --border-hover: #5a544d;
          --primary-color: #8b8680;
          --primary-hover: #9a948e;
          --primary-active: #a6a099;
          --primary-contrast: #fff;
          --warning-bg: rgba(198, 87, 70, 0.22);
          --warning-border: rgba(198, 87, 70, 0.45);
          --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3);
          --count-badge-bg: rgba(139, 134, 128, 0.28);
          --count-badge-text: #a6a099;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg-secondary);
        color: var(--text-primary);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Fira Sans",
          "Droid Sans",
          "Helvetica Neue",
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      input,
      textarea,
      select,
      a {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      :focus-visible {
        outline: 2px solid var(--primary-color);
        outline-offset: 2px;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-hover);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0s !important;
          animation-duration: 0s !important;
        }
      }
      @media (pointer: fine) {
        html {
          overscroll-behavior: none;
        }
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      [hidden] {
        display: none !important;
      }
      .shell {
        max-width: 1220px;
        margin: 0 auto;
        padding: 32px max(24px, env(safe-area-inset-right)) 48px
          max(24px, env(safe-area-inset-left));
      }
      html[data-parent-theme] .shell {
        padding-top: 88px;
      }
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        text-decoration: none;
        border-radius: 8px;
      }
      .brand img {
        width: 32px;
        height: 32px;
        flex: none;
      }
      .brand:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .heading h1 {
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.025em;
        margin: 8px 0;
        text-wrap: balance;
      }
      .heading p {
        color: var(--text-secondary);
        margin: 0;
        max-width: 660px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 600;
        line-height: 1.3;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .btn-primary {
        --btn-bg: color-mix(in srgb, var(--primary-color) 78%, #000);
        background: var(--btn-bg);
        border-color: var(--btn-bg);
        color: var(--primary-contrast);
      }
      .btn-primary:hover:not(:disabled) {
        --btn-bg: color-mix(in srgb, var(--primary-hover) 68%, #000);
      }
      .btn-secondary {
        background: var(--bg-tertiary);
        border-color: var(--border-color);
        color: var(--text-primary);
      }
      .btn-secondary:hover {
        background: var(--bg-hover);
        border-color: var(--border-hover);
      }
      .btn-small {
        padding: 8px 10px;
        font-size: 13px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 22px;
        margin-top: 16px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-tertiary);
        flex: none;
      }
      .status[data-kind="success"] .status-dot {
        background: var(--success-color);
      }
      .status[data-kind="error"] {
        color: var(--text-primary);
      }
      .status[data-kind="error"] .status-dot {
        background: var(--error-color);
      }
      .status a {
        color: var(--primary-color);
      }
      #check-update {
        position: relative;
      }
      .btn-version {
        color: var(--text-tertiary);
        font-weight: 500;
      }
      .update-dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--error-color);
      }
      .card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 24px;
      }
      .auth-card {
        margin-top: 24px;
        max-width: 480px;
      }
      .auth-card h2 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .auth-card p {
        color: var(--text-secondary);
        margin: 0 0 16px;
      }
      .auth-row {
        display: flex;
        gap: 8px;
      }
      .auth-row input {
        flex: 1;
        min-width: 0;
      }
      .overview {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 24px 0 16px;
      }
      .overview-title {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
      }
      .count {
        background: var(--count-badge-bg);
        color: var(--count-badge-text);
        border-radius: 9999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .key-list {
        display: grid;
        gap: 16px;
      }
      .key-card {
        padding: 0;
      }
      .key-header {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        padding: 16px 24px;
        border: 0;
        background: transparent;
        color: var(--text-primary);
        text-align: left;
        border-radius: 11px;
      }
      .key-header:hover {
        background: var(--bg-hover);
      }
      .key-header[aria-expanded="true"] {
        border-bottom: 1px solid var(--border-color);
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
      }
      .key-header:focus-visible {
        outline-offset: -4px;
      }
      .key-heading {
        margin: 0;
        font-size: inherit;
      }
      .key-info {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .key-summary {
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        font-weight: 400;
        overflow-wrap: anywhere;
      }
      .key-dirty {
        color: var(--text-primary);
        background: var(--count-badge-bg);
        border-radius: 9999px;
        padding: 3px 8px;
        font-size: 12px;
        white-space: nowrap;
      }
      .key-chevron {
        width: 18px;
        height: 18px;
        flex: none;
        margin-left: auto;
        color: var(--text-secondary);
      }
      .key-chevron svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .key-header[aria-expanded="true"] .key-chevron {
        transform: rotate(180deg);
      }
      .key-identity {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1 1 auto;
      }
      .key-icon {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        display: grid;
        place-items: center;
        color: var(--text-secondary);
        flex: none;
      }
      .key-icon svg {
        width: 19px;
        height: 19px;
      }
      .key-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.25;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .key-mask {
        font:
          12px/1.5 ui-monospace,
          "SF Mono",
          "Cascadia Mono",
          "JetBrains Mono",
          "Fira Code",
          Menlo,
          Consolas,
          monospace;
        color: var(--text-secondary);
      }
      .key-body {
        padding: 24px;
        display: grid;
        gap: 24px;
      }
      .identity-grid,
      .policy-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .label {
        font-weight: 600;
        color: var(--text-primary);
      }
      .hint {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--bg-secondary);
        color: var(--text-primary);
      }
      .input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(139, 134, 128, 0.18);
      }
      textarea {
        min-height: 72px;
        resize: vertical;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--text-secondary);
        opacity: 1;
      }
      .section-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .section-title strong {
        font-size: 14px;
      }
      .binding-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
      }
      .credential-list {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        max-height: 175px;
        overflow: auto;
      }
      .credential {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-color);
        cursor: pointer;
      }
      .credential:last-child {
        border-bottom: 0;
      }
      .credential:hover {
        background: var(--bg-hover);
      }
      .credential input {
        width: 16px;
        height: 16px;
        margin: 3px 0 0;
        accent-color: var(--primary-color);
        flex: none;
      }
      .credential-info {
        min-width: 0;
        display: grid;
      }
      .credential-name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .credential-meta {
        color: var(--text-secondary);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .empty-small {
        padding: 14px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .policy-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .policy-header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .policy-tag {
        font-size: 11px;
        font-weight: 700;
        border-radius: 9999px;
        padding: 3px 8px;
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        background: var(--bg-tertiary);
      }
      [data-parent-theme="dark"] .policy-tag {
        color: var(--text-tertiary);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-parent-theme]) .policy-tag {
          color: var(--text-tertiary);
        }
      }
      .chips {
        display: flex;
        align-items: center;
        align-content: flex-start;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 48px;
        padding: 7px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        position: relative;
      }
      .chips:focus-within {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(139, 134, 128, 0.18);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 100%;
        border: 1px solid var(--border-color);
        background: var(--bg-tertiary);
        border-radius: 9999px;
        padding: 3px 6px 3px 10px;
        color: var(--text-primary);
        font-size: 12px;
      }
      .chip span {
        overflow-wrap: anywhere;
      }
      .chip button {
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        padding: 6px;
        font-size: 16px;
        line-height: 1;
      }
      .chip button:hover {
        color: var(--error-color);
      }
      .chip-input {
        flex: 1 1 130px;
        min-width: 80px;
        border: 0;
        background: transparent;
        color: var(--text-primary);
        padding: 4px;
      }
      .chip-input:focus-visible {
        outline: none;
      }
      .suggest {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        z-index: 1000;
        max-height: 240px;
        overflow: auto;
        margin: 0;
        padding: 4px;
        list-style: none;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .suggest li {
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .suggest li:hover,
      .suggest li[aria-selected="true"] {
        background: var(--bg-hover);
      }
      .empty-state {
        border: 1px dashed var(--border-color);
        border-radius: 12px;
        padding: 24px;
        background: var(--bg-primary);
        color: var(--text-secondary);
      }
      .empty-state strong {
        display: block;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .warning {
        margin-top: 16px;
        border: 1px solid var(--warning-border);
        border-radius: 8px;
        background: var(--warning-bg);
        padding: 10px 12px;
        color: var(--text-primary);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .skip-link {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 10px;
        background: var(--bg-primary);
        color: var(--text-primary);
        transform: translateY(-150%);
      }
      .skip-link:focus-visible {
        transform: translateY(0);
      }
      @media (max-width: 700px) {
        .shell {
          padding: 24px max(16px, env(safe-area-inset-right)) 40px
            max(16px, env(safe-area-inset-left));
        }
        .topbar {
          gap: 16px;
        }
        .actions {
          width: 100%;
          flex-wrap: wrap;
        }
        .actions .btn {
          flex: 1;
        }
        .identity-grid,
        .policy-grid,
        .binding-grid {
          grid-template-columns: 1fr;
        }
        .key-header {
          padding: 16px;
        }
        .key-body {
          padding: 16px;
          gap: 20px;
        }
        .card {
          padding: 16px;
        }
        .key-card {
          padding: 0;
        }
        .heading h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>

      >Skip to client keys</a
    >

              entry = renderKey(key, rule, keys.length === 1);
            entry.baseline = JSON.stringify(normalizedRule(original));
            entries.push(entry);
          }
          $("#key-count").textContent = String(keys.length);
          $("#empty").hidden = keys.length > 0;
          $("#content").hidden = false;
          $("#auth").hidden = true;
          $("#save").disabled = false;
          updateCards();
          hasUnsavedChanges = entries.some((entry) => entry.dirty);
          setStatus(
            hasUnsavedChanges ? "unsaved" : "loaded",
            hasUnsavedChanges ? "" : "success",
          );
          setWarning(catalog.warning);
        } catch (error) {
          if (error.status === 401 || error.status === 403) {
            requestManualKey();
            $("#secret").focus();
          }
          setStatus(
            error.status === 401 || error.status === 403
              ? "authError"
              : "error",
            "error",
            error.message,
          );
        } finally {
          $("#load").disabled = false;
        }
      }
      async function save() {
        if (!cfg) return;
        try {
          $("#save").disabled = true;
          let active = new Set(entries.map((e) => e.scope));
          cfg.keys = [
            ...(cfg.keys || []).filter((r) => !active.has(r.scope)),
            ...draftEntries().filter(
              (r) =>
                r.name ||
                r.note ||
                r.auths.length ||
                r.allow_models.length ||
                r.deny_models.length,
            ),
          ];
          setStatus("saving");
          await api("config/plugins/configs/keyring", {
            method: "PUT",
            body: JSON.stringify(cfg),
          });
          clearDraft();
          hasUnsavedChanges = false;
          for (const entry of entries)
            entry.baseline = JSON.stringify(entryValues(entry));
          updateCards();
          setStatus("saved", "success");
        } catch (error) {
          if (error.status === 401 || error.status === 403) {
            requestManualKey();
            $("#secret").focus();
          }
          setStatus(
            error.status === 401 || error.status === 403
              ? "authError"
              : "saveError",
            "error",
            error.message,
          );
        } finally {
          if (managementKey) $("#save").disabled = false;
        }
      }
      $("#load").addEventListener("click", () => {
        if (hasUnsavedChanges && !window.confirm(t("discard"))) return;
        clearDraft();
        hasUnsavedChanges = false;
        load();
      });
      window.addEventListener("beforeunload", (event) => {
        if (hasUnsavedChanges) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
      $("#connect").addEventListener("click", load);
      $("#secret").addEventListener("keydown", (event) => {
        if (event.key === "Enter") load();
      });
      $("#save").addEventListener("click", save);
      function parseVersion(tag) {
        const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(tag);
        return m && m.slice(1).map(Number);
      }
      async function checkUpdate() {
        const button = $("#check-update"),
          label = button.querySelector("[data-i18n]");
        button.disabled = true;
        label.dataset.i18n = "checkingUpdate";
        label.textContent = t("checkingUpdate");
        try {
          const res = await fetch(
            "https://api.github.com/repos/iiimabbie/cpa-keyring/releases/latest",
            { headers: { Accept: "application/vnd.github+json" } },
          );
          if (!res.ok) throw new Error("HTTP " + res.status);
          const tag = (await res.json()).tag_name,
            latest = parseVersion(tag),
            current = parseVersion("__KEYRING_VERSION__");
          if (!latest || !current) throw new Error("not comparable: " + tag);
          const diff = latest.map((n, i) => n - current[i]).find((d) => d);
          button.querySelector(".update-dot").hidden = !(diff > 0);
          if (diff > 0) setStatus("updateAvailable", "success", tag);
          else setStatus("updateLatest", "success");
        } catch (error) {
          setStatus("updateFailed", "error", error.message);
        } finally {
          label.dataset.i18n = "checkUpdate";
          label.textContent = t("checkUpdate");
          button.disabled = false;
        }
      }
      $("#check-update").addEventListener("click", checkUpdate);
      translate();
      managementKey = storedManagementKey();
      if (managementKey) load();
      else requestManualKey();
    </script>
  </body>
</html>
